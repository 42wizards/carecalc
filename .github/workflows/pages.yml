name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Switch Pages source to GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow

      - name: Assemble site into public/
        run: |
          if [ ! -d public ]; then
            echo "public directory not found" && exit 1
          fi
          # skip Jekyll processing
          touch public/.nojekyll
          # the page loads src/calculateCost.js, so include it in the deployed site
          cp -r src public/src

      # If you have a build step (npm, hugo, etc.), add it here and ensure output goes to ./public

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
