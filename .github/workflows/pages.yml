name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure public/.nojekyll (skip Jekyll processing)
        run: |
          if [ -d public ]; then
            touch public/.nojekyll
          else
            echo "public directory not found" && exit 1
          fi

      # If you have a build step (npm, hugo, etc.), add it here and ensure output goes to ./public

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
